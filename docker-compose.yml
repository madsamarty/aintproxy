services:
  ipflip:
    build: .
    container_name: ipflip
    network_mode: host
    # Drop ALL capabilities, then add only what we actually need:
    #   NET_ADMIN — ip route/rule, sysctl network tuning
    # We keep host networking (not a capability) for modem LAN access.
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    # Prevent the container from gaining new privileges via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem; Python/OS only need /tmp and /run writable
    read_only: true
    tmpfs:
      - /tmp
      - /run
    env_file: .env
    volumes:
      # D-Bus socket (read-only) so nmcli can talk to the host's NetworkManager
      - /run/dbus/system_bus_socket:/host/run/dbus/system_bus_socket:ro
      # NetworkManager config from the host (read-only)
      - /etc/NetworkManager:/etc/NetworkManager:ro
    environment:
      - USE_SUDO=false
    restart: unless-stopped
