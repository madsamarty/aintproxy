[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ipflip"
version = "0.1.0"
description = "Flip your public IP by rebooting or toggling a Huawei 4G/5G modem"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Mohamed Sameh" },
]
keywords = ["ip", "ip-rotation", "ipflip", "huawei", "modem", "scraping", "cg-nat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking",
]
dependencies = [
    "requests>=2.20",
    "python-dotenv>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
ipflip = "ipflip.cli:main"

[tool.setuptools.packages.find]
include = ["ipflip*"]
